# Spark settings shared by every Lakehouse job (mounted at /opt/lakehouse/spark; use --properties-file).
# Packages are resolved once and cached in the spark-ivy volume.
spark.jars.packages               org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.10.0,org.apache.iceberg:iceberg-aws-bundle:1.10.0,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.6
spark.jars.ivy                    /root/.ivy2
spark.sql.extensions              org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lh              org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lh.type         rest
spark.sql.catalog.lh.uri          http://iceberg-rest:8181
spark.sql.catalog.lh.warehouse    s3://lakehouse/warehouse
spark.sql.catalog.lh.io-impl      org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lh.s3.endpoint  http://minio:9000
spark.sql.catalog.lh.s3.path-style-access true
spark.sql.defaultCatalog          lh
spark.sql.shuffle.partitions      8
spark.driver.memory               1g
spark.ui.enabled                  false
