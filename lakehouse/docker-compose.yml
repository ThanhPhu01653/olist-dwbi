# Olist Lakehouse (P10). Profiles: lite (default for this laptop, WSL 4 GB), demo (adds Superset), full (adds Airflow; not provided on this machine).
#   docker compose --profile lite up -d          PowerShell and bash are the same
#   docker compose --profile lite down            (add -v to delete the data volumes)
# Every image has a pinned tag (no "latest"); reasons in docs/LAKEHOUSE.md section 3.
# mem_limit is a ceiling, not a reservation: Spark is idle until a job is started with docker exec.

name: olist-lakehouse

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${LH_MINIO_USER}
  AWS_SECRET_ACCESS_KEY: ${LH_MINIO_PASSWORD}
  AWS_REGION: us-east-1

services:
  pg:
    image: postgres:17.7
    profiles: [lite, demo, full]
    container_name: lh-pg
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10", "-c", "shared_buffers=128MB", "-c", "max_connections=60"]
    environment:
      POSTGRES_USER: ${LH_PG_USER}
      POSTGRES_PASSWORD: ${LH_PG_PASSWORD}
      POSTGRES_DB: ${LH_PG_DB}
      LH_CATALOG_DB: ${LH_CATALOG_DB}
    ports: ["127.0.0.1:${LH_PG_PORT}:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LH_PG_USER} -d ${LH_PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:3.9.1
    profiles: [lite, demo, full]
    container_name: lh-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx320m"
    volumes: [kafka-data:/var/lib/kafka/data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 20s

  connect:
    image: quay.io/debezium/connect:3.2.0.Final
    profiles: [lite, demo, full]
    container_name: lh-connect
    depends_on:
      kafka: {condition: service_healthy}
      pg: {condition: service_healthy}
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: lh-connect
      CONFIG_STORAGE_TOPIC: lh_connect_configs
      OFFSET_STORAGE_TOPIC: lh_connect_offsets
      STATUS_STORAGE_TOPIC: lh_connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx448m"
    ports: ["127.0.0.1:${LH_CONNECT_PORT}:8083"]
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    profiles: [lite, demo, full]
    container_name: lh-minio
    environment:
      MINIO_ROOT_USER: ${LH_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${LH_MINIO_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${LH_MINIO_BUCKET}
    ports:
      - "127.0.0.1:${LH_MINIO_PORT}:9000"
      - "127.0.0.1:${LH_MINIO_CONSOLE_PORT}:9001"
    volumes: [minio-data:/bitnami/minio/data]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  iceberg-rest:
    build: ./iceberg-rest                      # apache/iceberg-rest-fixture:1.10.0 + PostgreSQL JDBC driver 42.7.4
    image: olist-lakehouse/iceberg-rest:1.10.0-pg42.7.4
    profiles: [lite, demo, full]
    container_name: lh-iceberg-rest
    depends_on:
      pg: {condition: service_healthy}
      minio: {condition: service_healthy}
    environment:
      <<: *s3-env
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://pg:5432/${LH_CATALOG_DB}
      CATALOG_JDBC_USER: ${LH_PG_USER}
      CATALOG_JDBC_PASSWORD: ${LH_PG_PASSWORD}
      CATALOG_WAREHOUSE: s3://${LH_MINIO_BUCKET}/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
    ports: ["127.0.0.1:${LH_REST_PORT}:8181"]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/v1/config > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  spark:
    image: apache/spark:3.5.6-python3
    profiles: [lite, demo, full]
    container_name: lh-spark
    user: root
    depends_on:
      kafka: {condition: service_healthy}
      iceberg-rest: {condition: service_healthy}
    command: ["sleep", "infinity"]          # jobs are started with: docker exec lh-spark /opt/spark/bin/spark-submit ... (see lakehouse/README.md)
    environment:
      <<: *s3-env
      LH_MINIO_BUCKET: ${LH_MINIO_BUCKET}
    volumes:
      - ./spark:/opt/lakehouse/spark:ro
      - ../seeds:/opt/lakehouse/seeds:ro
      - spark-ivy:/root/.ivy2
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "test -x /opt/spark/bin/spark-submit"]
      interval: 30s
      timeout: 5s
      retries: 3

  trino:
    image: trinodb/trino:477
    profiles: [lite, demo, full]
    container_name: lh-trino
    depends_on:
      iceberg-rest: {condition: service_healthy}
    environment:
      <<: *s3-env
      LH_MINIO_USER: ${LH_MINIO_USER}
      LH_MINIO_PASSWORD: ${LH_MINIO_PASSWORD}
    ports: ["127.0.0.1:${LH_TRINO_PORT}:8080"]
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/catalog:/etc/trino/catalog:ro
    mem_limit: 1280m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

volumes:
  pg-data:
  kafka-data:
  minio-data:
  spark-ivy:
